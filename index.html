<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1F4B44">
<title>Counter</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="header">
    <input
      id="nameInput"
      class="name-input"
      type="text"
      maxlength="40"
      placeholder="Name this prayer"
      autocomplete="off"
      spellcheck="false"
    >
  </header>

  <main class="ring-area">
    <div class="tap-button">
      <button id="tapSurface" class="tap-surface" aria-label="Count">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-track" cx="100" cy="100" r="90"></circle>
          <circle id="ringProgress" class="ring-progress" cx="100" cy="100" r="90"></circle>
          <g id="beads"></g>
        </svg>
      </button>
      <div class="ring-center">
        <button id="countValue" class="count-value" type="button" aria-label="Set count"></button>
        <input id="countInput" class="count-input" type="number" inputmode="numeric" hidden>
        <span id="targetLabel" class="target-label"></span>
      </div>
    </div>

    <div id="reachedBanner" class="reached-banner" hidden>
      <span>Target reached</span>
      <button id="keepGoingBtn" class="text-btn">Keep going</button>
    </div>
  </main>

  <div class="bottom-bar">
    <footer class="controls">
      <div class="target-row">
        <label for="targetInput" class="target-field-label">Target</label>
        <input
          id="targetInput"
          class="target-input"
          type="number"
          inputmode="numeric"
          min="1"
          placeholder="None"
        >
      </div>
      <button id="muteBtn" class="mute-button" aria-label="Mute signal" aria-pressed="false">
        <svg id="muteIconOn" class="mute-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor"/>
          <path d="M16.5 12c0-1.77-.77-3.29-2-4.24v8.48c1.23-.95 2-2.47 2-4.24z" fill="currentColor"/>
        </svg>
        <svg id="muteIconOff" class="mute-icon" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor"/>
          <line x1="15.5" y1="8.5" x2="21.5" y2="15.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="21.5" y1="8.5" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="resetBtn" class="reset-button">Reset</button>
    </footer>
  </div>

</div>

<div id="flashOverlay" class="flash-overlay" aria-hidden="true"></div>

<div id="resetConfirm" class="confirm-overlay" hidden>
  <div class="confirm-card" role="alertdialog" aria-labelledby="resetConfirmTitle">
    <p id="resetConfirmTitle" class="confirm-title">Reset count to 0?</p>
    <p class="confirm-sub">The name and target stay the same.</p>
    <div class="confirm-actions">
      <button id="resetCancelBtn" class="confirm-btn confirm-btn-cancel">Cancel</button>
      <button id="resetConfirmBtn" class="confirm-btn confirm-btn-danger">Reset</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
