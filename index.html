<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1F4B44">
<title>Counter</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="header">
    <input
      id="nameInput"
      class="name-input"
      type="text"
      maxlength="40"
      placeholder="Name this prayer"
      autocomplete="off"
      spellcheck="false"
    >
  </header>

  <main class="ring-area">
    <button id="tapBtn" class="tap-button" aria-label="Count">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-track" cx="100" cy="100" r="90"></circle>
        <circle id="ringProgress" class="ring-progress" cx="100" cy="100" r="90"></circle>
        <g id="beads"></g>
      </svg>
      <div class="ring-center">
        <span id="countValue" class="count-value">0</span>
        <span id="targetLabel" class="target-label"></span>
      </div>
    </button>

    <div id="reachedBanner" class="reached-banner" hidden>
      <span>Target reached</span>
      <button id="keepGoingBtn" class="text-btn">Keep going</button>
    </div>
  </main>

  <footer class="controls">
    <div class="target-row">
      <label for="targetInput" class="target-field-label">Target</label>
      <input
        id="targetInput"
        class="target-input"
        type="number"
        inputmode="numeric"
        min="1"
        placeholder="None"
      >
    </div>
    <button id="muteBtn" class="mute-button" aria-label="Mute signal" aria-pressed="false">
      <svg id="muteIconOn" class="mute-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor"/>
        <path d="M16.5 12c0-1.77-.77-3.29-2-4.24v8.48c1.23-.95 2-2.47 2-4.24z" fill="currentColor"/>
      </svg>
      <svg id="muteIconOff" class="mute-icon" viewBox="0 0 24 24" aria-hidden="true" hidden>
        <path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor"/>
        <line x1="15.5" y1="8.5" x2="21.5" y2="15.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="21.5" y1="8.5" x2="15.5" y2="15.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="resetBtn" class="reset-button">Reset</button>
  </footer>

  <div id="undoToast" class="undo-toast" hidden>
    <span id="undoText">Count reset</span>
    <button id="undoBtn" class="text-btn">Undo</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
